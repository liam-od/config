---
- name: Validate the default Git identity
  ansible.builtin.assert:
    that:
      - git_user_name | default('') | length > 0
      - git_user_email | default('') | length > 0
    fail_msg: >-
      Set git_user_name and git_user_email in host_vars/localhost.yml.
      See host_vars/localhost.yml.example.

- name: Create the Git config
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ user_home }}/.gitconfig"
    mode: "0644"
