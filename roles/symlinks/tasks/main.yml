---
- name: Ensure symlink destination directories exist
  ansible.builtin.file:
    path: "{{ user_home }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: .ssh
      mode: "0700"
    - path: .config
      mode: "0755"
    - path: .config/herdr
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

- name: Symlink dotfiles
  ansible.builtin.file:
    src: "{{ playbook_dir }}/dotfiles/{{ item }}"
    dest: "{{ user_home }}/{{ item }}"
    state: link
    force: true
    follow: false
  loop:
    - .ssh/config
    - .zshrc
    - .config/herdr/config.toml
    - .config/starship.toml
    - .config/nvim
    - .latexmkrc
    - .chktexrc
    - .wezterm.lua
  loop_control:
    label: "{{ item }}"
